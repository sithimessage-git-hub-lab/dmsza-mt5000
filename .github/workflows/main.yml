name: Build OpenWrt for GL-MT5000

# 触发条件：手动触发（推荐）或推送到 main 分支
on:
  workflow_dispatch:  # 允许手动触发，便于你随时编译
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 虚拟环境

    steps:
      # 检出你的仓库代码，并切换到 openwrt-25.12-mt5000 分支[8](@ref)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: openwrt-25.12-mt5000

      # 安装编译 OpenWrt 所需的基础依赖库[1](@ref)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev \
          libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget

      # 更新 feeds（OpenWrt 的软件包源）[1](@ref)
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 生成默认配置，你之后可以在此处修改为你的自定义 .config 文件[1](@ref)
      - name: Generate config
        run: make defconfig

      # 预下载编译所需的依赖包，避免编译中途失败[1](@ref)
      - name: Download dependencies
        run: make download -j$(nproc)

      # 开始编译固件（-j 参数使用所有 CPU 核心加速编译，V=s 输出详细日志）[1](@ref)
      - name: Build firmware
        run: make -j$(nproc) V=s

      # 打包编译产物（.bin 固件文件），方便你下载[1](@ref)
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/targets/**  # 固件输出目录
