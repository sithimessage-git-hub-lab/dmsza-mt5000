name: Build OpenWrt for GL-MT5000

# 触发条件：手动触发（推荐）
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出你的仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 清理系统环境，释放磁盘空间
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 安装编译 OpenWrt 所需的基础依赖库
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev \
          libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget

      # 克隆 OpenWrt 源码并切换到 openwrt-25.12-mt5000 分支
      - name: Clone source code
        run: |
          git clone https://github.com/dmsza/openwrt.git -b openwrt-25.12-mt5000 openwrt

      # 更新 feeds（OpenWrt 的软件包源）
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 加载自定义配置并设置 GL-MT5000 目标设备
      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e .config ] && cp .config openwrt/.config
          cd openwrt
          
          # 设置 GL-MT5000 目标设备配置
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y" >> .config
          
          make defconfig

      # 预下载编译所需的依赖包
      - name: Download package
        run: |
          cd openwrt
          make download -j8
          # 清理下载失败的空文件（通常小于 1KB）
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 开始编译固件（使用多线程编译，如果失败则使用单线程并输出详细日志）
      - name: Compile the firmware
        run: |
          cd openwrt
          echo "编译开始：$(date)"
          echo "使用 $(nproc) 线程编译"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "编译结束：$(date)"

      # 查找编译生成的固件文件
      - name: Find firmware files
        run: |
          cd openwrt
          echo "=== 检查 bin/targets 目录 ==="
          find bin/targets -type f -name "*.bin" -o -type f -name "*.img" -o -type f -name "*.itb" -o -type f -name "*.gz" | tee /tmp/firmware-list.txt
          echo "=== 固件文件列表 ==="
          cat /tmp/firmware-list.txt
          
          # 检查是否有固件文件
          if [ -s /tmp/firmware-list.txt ]; then
            echo "✅ 固件文件已生成"
            echo "FIRMWARE_FOUND=true" >> $GITHUB_ENV
          else
            echo "❌ 未找到固件文件"
            echo "FIRMWARE_FOUND=false" >> $GITHUB_ENV
          fi

      # 上传固件到 GitHub Actions Artifacts
      - name: Upload firmware
        if: env.FIRMWARE_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mt5000-firmware-${{ github.run_number }}
          path: openwrt/bin/targets/**/*
          if-no-files-found: error

      # 如果没有生成固件，显示帮助信息
      - name: Show help if no firmware
        if: env.FIRMWARE_FOUND == 'false'
        run: |
          echo "❌ 固件编译失败或未生成固件文件"
          echo "请检查编译日志，特别关注以下内容："
          echo "1. 是否正确选择了目标设备（MediaTek Filogic -> GL.iNet MT5000）"
          echo "2. 检查 .config 文件中是否有 CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y"
          echo "3. 查看编译日志中的错误信息"
